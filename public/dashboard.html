<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Gestión de Tareas</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Gestión de Tareas</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" data-section="inicio" class="active">Inicio</a></li>
                <li><a href="#" data-section="tareas">Mis Tareas</a></li>
                <li><a href="#" data-section="celula">Mi Célula</a></li>
                <li id="clanMenu" style="display: none;"><a href="#" data-section="clanes">Mis Clanes</a></li>
                <li><a href="#" data-section="perfil">Mi Perfil</a></li>
                <li><a href="#" id="logoutBtn">Cerrar Sesión</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="dashboard-header">
                <h1 id="welcomeMessage">Bienvenido</h1>
                <div class="notifications">
                    <span class="notification-badge" id="notificationCount">0</span>
                    <button class="btn-icon" id="notificationBtn">🔔</button>
                </div>
            </header>

            <div id="contentArea">
                <!-- El contenido dinámico se cargará aquí -->
            </div>
        </main>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
